seed: 42
output_dir: outputs/single_frame_resnet18_continuous

data:
  train_manifest: data/toy_dataset/manifests/train_manifest.json
  val_manifest: data/toy_dataset/manifests/val_manifest.json
  image_size: 224
  window_size: 8
  num_workers: 0
  batch_size: 8
  pose_representation: pose7_quaternion

model:
  pose_output_dim: 7
  pretrained_backbone: false
  freeze_backbone: false
  mlp_hidden_dim: 128
  dropout: 0.2

optimizer:
  lr: 0.0001
  weight_decay: 0.0001

trainer:
  epochs: 5
  device: cuda
  loss: smooth_l1
