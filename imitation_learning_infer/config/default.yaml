policy:
  type: act
  model_dir: ../imitation_learning_ACT/runs/act_pose_h20
  checkpoint_name: best.pt
  dataset_version: without_force
  use_force_condition: false
  image_size: 224
  action_horizon: 20
  action_dim: 7
  device: auto
  act_model:
    pretrained_resnet18: true
    freeze_encoder: false
    hidden_dim: 512
    nhead: 8
    num_decoder_layers: 4
    dim_feedforward: 2048
    dropout: 0.1
  diffusion_model:
    pretrained_resnet18: true
    freeze_encoder: false
    condition_dim: 512
    hidden_dim: 1024
    time_embed_dim: 128
  diffusion:
    num_steps: 100
    beta_start: 0.0001
    beta_end: 0.02

runtime:
  camera_hz: 30.0
  control_hz: 1000.0
  transport: tcp
  host: 127.0.0.1
  port: 50555
  reconnect_delay_s: 1.0
  send_timeout_s: 0.2
  receive_timeout_ms: 150

ultrasound:
  source: image_folder # image_folder or live_camera
  image_dir:
  live_config: ../data_collection/ultrasound_image_collection/config/default.yaml

motion:
  action_dt_s: 0.03
  speed_scale: 0.4
  execute_steps_per_inference: 1
  mode: relative
  interpolator: quintic
  bspline_smoothing_factor: 0.0016
  ramp_time_s: 3.0
  hold_on_no_prediction: true

  online_filter:
    enabled: true
    cutoff_hz: 1.0
    orientation_enabled: true
    orientation_cutoff_hz: 1.0

  limits:
    max_step_translation_m: 0.003
    max_step_rotation_rad: 0.05
    max_translation_speed_mps: 0.2
    max_translation_acceleration_mps2: 0.07
    max_rotation_speed_radps: 0.35
    max_rotation_acceleration_radps2: 0.5

force_safety:
  enabled: true
  source: external_6d
  reader: placeholder # placeholder or kwr75b_serial
  sampling_hz: 30.0
  consecutive_violation_limit: 3
  violation_action: hold_position
  serial:
    port: AUTO
    serial_number: AB0KU8NU
    baudrate: 460800
    request_mode: true
    debug: false
    bias_file: ../data_collection/6D_force_grasping/config/zero_bias.json
  max_abs:
    Fx_N: 10.0
    Fy_N: 10.0
    Fz_N: 15.0
    Mx_Nm: 0.8
    My_Nm: 0.8
    Mz_Nm: 0.8

franka_safety:
  enable_collision_behavior: true
  enable_cartesian_impedance: true
  translational_stiffness: 600.0
  rotational_stiffness: 30.0
  damping_ratio: 1.0
