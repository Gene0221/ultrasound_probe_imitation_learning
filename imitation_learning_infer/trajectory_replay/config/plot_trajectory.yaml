# Plot configuration for scripts/plot_spline_vs_hermite.py.
# Relative paths are resolved from imitation_learning_infer/trajectory_replay/.

paths:
  input_csv: ./config/replay_trajectory.csv
  output_dir: ./analysis
  # Leave empty to generate names from input_csv, mode, and smoothing_factor.
  output_prefix:

plot:
  # comparison: draw B-spline and polynomial interpolation together
  # bspline: draw only the local cubic B-spline result
  # polynomial: draw only the polynomial interpolation result
  mode: comparison
  dt: 0.001
  zoom_start_s: 0.0
  zoom_end_s: 5.0
  make_full_plot: true
  make_zoom_plot: true
  write_interpolated_csv: true
  title:

bspline:
  smoothing_factor: 0.0016
