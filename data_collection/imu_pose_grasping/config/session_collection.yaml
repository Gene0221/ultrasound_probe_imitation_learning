output_root: output
logging_root: logs

behavior:
  allow_degraded_start: true
  start_pause_key: ENTER
  quit_key: q

modules:
  imu:
    enabled: true
    adapter: imu
    allow_placeholder: false
    output_subdir: .
    initialize_command: null
    command:
      - python
      - scripts/log_d435i_pitch_roll.py
      - --config
      - config/default.yaml
    workdir: .
