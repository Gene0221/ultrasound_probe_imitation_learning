output_root: output
logging_root: logs

behavior:
  allow_degraded_start: true
  start_pause_key: ENTER
  quit_key: q

modules:
  ultrasound:
    enabled: true
    adapter: ultrasound
    allow_placeholder: false
    output_subdir: .
    initialize_command: null
    command:
      - python
      - scripts/capture_ultrasound_frames.py
      - --config
      - config/default.yaml
    workdir: .

device:
  path: AUTO
  by_id: ""
  by_path: ""
  name_contains: ""
  serial_number: ""
  vendor_id: ""
  product_id: ""
  usb_path_contains: ""

capture:
  backend: V4L2
  width: 640
  height: 480
  fps: 30.0
  fourcc: MJPG

recording:
  target_hz: 30.0
  include_device_name: true

output:
  output_root: output
  images_subdir: images
  timestamps_file_name: timestamps.jsonl
  summary_file_name: summary.json
  frame_prefix: frame_
  image_format: png
  png_compression: 3
  jpg_quality: 95
  print_stdout: true
