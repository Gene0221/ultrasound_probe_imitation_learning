output_root: output
logging_root: logs

behavior:
  allow_degraded_start: true
  start_pause_key: ENTER
  quit_key: q

modules:
  visual_pose:
    enabled: true
    adapter: visual_pose
    allow_placeholder: false
    output_subdir: .
    initialize_command: null
    command:
      - python
      - scripts/track_apriltag_pose_deltas.py
      - --config
      - config/apriltag_tracking.yaml
    workdir: .
