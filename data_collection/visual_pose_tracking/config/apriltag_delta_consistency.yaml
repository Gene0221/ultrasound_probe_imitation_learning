camera_a:
  serial_no: "213622073198"

camera_b:
  serial_no: "213722070411"

capture:
  width: 1280
  height: 720
  fps: 30
  warmup_frames: 15
  startup_timeout: 20.0
  buffer_size: 30
  sync_max_delta_ms: 20.0

intrinsics:
  camera_a: "intrinsics/camera_a_calibration_result.json"
  camera_b: "intrinsics/camera_b_calibration_result.json"

apriltag:
  family: "tag36h11"
  nthreads: 2
  quad_decimate: 1.0
  quad_sigma: 0.0
  refine_edges: 1
  decode_sharpening: 0.25
  tag_size_m: 0.0195
  max_hamming: 0

compare:
  tag_id: 0
  print_interval_seconds: 3.0

preview:
  width: 1280
  window_name: "AprilTag Delta Consistency Test"
