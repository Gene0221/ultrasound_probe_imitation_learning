output_root: output
logging_root: logs

behavior:
  allow_degraded_start: true
  start_pause_key: ENTER
  quit_key: q

modules:
  real_pose:
    enabled: true
    adapter: real_pose
    allow_placeholder: false
    output_subdir: .
    initialize_command: null
    command:
      - python
      - scripts/controlled_real_pose_logger.py
      - --config
      - config/default.yaml
    workdir: .
