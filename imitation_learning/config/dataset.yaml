input:
  session_root: E:/research_data/rotate/output
  session_prefix: session_

output:
  dataset_root: E:/research_data/training_datasets/ultrasound_pose_h20

session_layout:
  ultrasound_subdir: ultrasound
  ultrasound_timestamps_file: timestamps.jsonl
  ultrasound_images_subdir: images
  pose_subdir: transformed_pose
  pose_file: flange_pose_deltas.jsonl
  force_subdir: predicted_force
  force_file: predicted_force.jsonl

alignment:
  max_pose_delta_s: 0.05
  max_force_delta_s: 0.05

dataset:
  action_horizon: 20
  action_dim: 7
  force_dim: 1
  include_versions:
    - without_force
    - with_force
  overwrite: true

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  split_by: session
