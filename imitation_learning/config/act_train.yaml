dataset:
  dataset_root: E:/research_data/training_datasets/ultrasound_pose_h20
  version: without_force
  action_horizon: 20
  image_size: 224

model:
  pretrained_resnet18: true
  freeze_encoder: false
  hidden_dim: 512
  nhead: 8
  num_decoder_layers: 4
  dim_feedforward: 2048
  dropout: 0.1
  action_dim: 7
  force_dim: 1

training:
  output_dir: runs/act_pose_h20
  batch_size: 32
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.00001
  num_workers: 0
  seed: 42
  loss: l1
