seed: 42
output_dir: outputs/temporal_resnet18_lstm_continuous

data:
  train_manifest: data/toy_dataset/manifests/train_manifest.json
  val_manifest: data/toy_dataset/manifests/val_manifest.json
  image_size: 224
  window_size: 8
  num_workers: 0
  batch_size: 4
  pose_representation: pose7_quaternion
  use_force: true
  force_dim: 6

model:
  pose_output_dim: 7
  pretrained_backbone: false
  freeze_backbone: false
  pose_feature_dim: 64
  force_feature_dim: 32
  lstm_hidden_dim: 256
  lstm_num_layers: 1
  lstm_dropout: 0.0
  mlp_hidden_dim: 128
  dropout: 0.2

optimizer:
  lr: 0.0001
  weight_decay: 0.0001

trainer:
  epochs: 5
  device: cuda
  loss: smooth_l1
